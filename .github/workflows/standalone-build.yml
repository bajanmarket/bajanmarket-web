name: Standalone build

on:
  push:
    branches:
      - migration/standalone
  pull_request:
    branches:
      - source-lovable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
